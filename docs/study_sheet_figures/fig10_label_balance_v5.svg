<svg xmlns='http://www.w3.org/2000/svg' font-family='system-ui, sans-serif' viewBox="0 0 760 392" role="img" aria-label="Evidenced negatives are a sliver of the v5 labels" font-size="16"><text data-claude-text-id="title" x="24" y="36" font-size="20" font-weight="600" fill="#1a1a1a">Evidenced negatives are a sliver of the v5 labels</text><text x="24" y="62" font-size="15" fill="#5c5c5c">Unlabelled silence is 22 times the kept positives</text><g data-claude-anchor="x-axis"><g><line x1="320" x2="320" y1="110" y2="336" stroke="#d9d9d9"></line><text x="320" y="100" text-anchor="middle" font-size="14" fill="#5c5c5c">10</text></g><g><line x1="400" x2="400" y1="110" y2="336" stroke="#d9d9d9"></line><text x="400" y="100" text-anchor="middle" font-size="14" fill="#5c5c5c">100</text></g><g><line x1="480" x2="480" y1="110" y2="336" stroke="#d9d9d9"></line><text x="480" y="100" text-anchor="middle" font-size="14" fill="#5c5c5c">1,000</text></g><g><line x1="560" x2="560" y1="110" y2="336" stroke="#d9d9d9"></line><text x="560" y="100" text-anchor="middle" font-size="14" fill="#5c5c5c">10,000</text></g><g><line x1="640" x2="640" y1="110" y2="336" stroke="#d9d9d9"></line><text x="640" y="100" text-anchor="middle" font-size="14" fill="#5c5c5c">100,000</text></g></g><g data-claude-anchor="row-silence"><circle cx="638.7261627122265" cy="136" r="7" fill="#a3a3a3"><title>96,400 pairs</title></circle><text x="652.7261627122265" y="141" font-size="15" font-weight="400" fill="#1a1a1a">96,400</text></g><g data-claude-anchor="row-kept"><circle cx="531.8375566690378" cy="184" r="7" fill="#a3a3a3"><title>4,446 pairs</title></circle><text x="545.8375566690378" y="189" font-size="15" font-weight="400" fill="#1a1a1a">4,446</text></g><g data-claude-anchor="row-setaside"><circle cx="524.7158756782432" cy="232" r="7" fill="#a3a3a3"><title>3,622 pairs</title></circle><text x="538.7158756782432" y="237" font-size="15" font-weight="400" fill="#1a1a1a">3,622</text></g><g data-claude-anchor="row-negatives