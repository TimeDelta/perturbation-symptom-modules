<svg xmlns='http://www.w3.org/2000/svg' font-family='system-ui, sans-serif' viewBox="0 0 760 900" role="img" aria-label="Land the cyclase fix first; one rebuild then serves all" font-size="15"><defs><marker id="path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"></path></marker></defs><text data-claude-text-id="title" x="24" y="36" font-size="20" font-weight="600" fill="#1a1a1a">Land the cyclase fix first; one rebuild then serves all</text><text data-claude-text-id="subtitle" x="24" y="62" fill="#5c5c5c">Blue boxes wait on you; every other box is session work</text><text data-claude-text-id="lane-a" x="136" y="106" text-anchor="middle" font-weight="600" fill="#1a1a1a">A. Cyclase fix</text><text data-claude-text-id="lane-b" x="380" y="106" text-anchor="middle" font-weight="600" fill="#1a1a1a">B. Lockbox</text><text data-claude-text-id="lane-c" x="624" y="106" text-anchor="middle" font-weight="600" fill="#1a1a1a">C. Steady-state tests</text><g data-claude-anchor="connectors" fill="none" stroke="#6b6b6b" stroke-width="1.25"><path d="M136 204V240" marker-end="url(#path-arrow)"></path><path d="M136 316V352" marker-end="url(#path-arrow)"></path><path d="M136 428V464" marker-end="url(#path-arrow)"></path><path d="M380 428V464" marker-end="url(#path-arrow)"></path><path d="M136 540V576" marker-end="url(#path-arrow)"></path><path d="M380 540V576" marker-end="url(#path-arrow)"></path><path d="M624 540V576" marker-end="url(#path-arrow)"></path><path d="M136 652V688" marker-end="url(#path-arrow)"></path><path d="M380 652V688" marker-end="url(#path-arrow)"></path><path d="M624 652V688" marker-end="url(#path-arrow)"></path><path d="M380 764V800" marker-end="url(#path-arrow)"></path><path d="M624 764V800" marker-end="url(#path-arrow)"></path></g><g data-claude-anchor="a1"><rect x="24" y="128" width="224" height="76" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"></rect><text data-claude-text-id="a1-a" x="136" y="160" text-anchor="middle" fill="#1a1a1a">Fable recheck of the</text><text data-claude-text-id="a1-b" x="136" y="182" text-anchor="middle" fill="#1a1a1a">cyclase isoform table</text></g><g data-claude-anchor="a2"><rect x="24" y="240" width="224" height="76" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"></rect><text data-claude-text-id="a2-a" x="136" y="272" text-anchor="middle" font-weight="600" fill="#1a1a1a">You: two questions</text><text data-claude-text-id="a2-b" x="136" y="294" text-anchor="middle" fill="#1a1a1a">under 9.97</text></g><g data-claude-anchor="a3"><rect x="24" y="352" width="224" height="76" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"></rect><text data-claude-text-id="a3-a" x="136" y="384" text-anchor="middle" fill="#1a1a1a">Build correction,</text><text data-claude-text-id="a3-b" x="136" y="406" text-anchor="middle" fill="#1a1a1a">tests, ablation flag</text></g><g data-claude-anchor="b3"><rect x="268" y="352" width="224" height="76" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"></rect><text data-claude-text-id="b3-a" x="380" y="376" text-anchor="middle" font-weight="600" fill="#1a1a1a">You: rule 9.87,</text><text data-claude-text-id="b3-b" x="380" y="396" text-anchor="middle" fill="#1a1a1a">keep the GEO copy,</text><text data-claude-text-id="b3-c" x="380" y="416" text-anchor="middle" fill="#1a1a1a">tick the BRENDA licence</text></g><text data-claude-text-id="c-note-a" x="624" y="272" text-anchor="middle" fill="#5c5c5c">Needs a built graph;</text><text data-claude-text-id="c-note-b" x="624" y="294" text-anchor="middle" fill="#5c5c5c">the v5 build was lost</text><g data-claude-anchor="rebuild"><rect x="24" y="464" width="712" height="76" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"></rect><text data-claude-text-id="rebuild-a" x="380" y="496" text-anchor="middle" font-weight="600" fill="#1a1a1a">Rebuild v5 once, into a fresh data/processed</text><text data-claude-text-id="rebuild-b" x="380" y="518" text-anchor="middle" fill="#1a1a1a">Record node and edge counts and the sha256 of edges.parquet</text></g><g data-claude-anchor="a5"><rect x="24" y="576" width="224" height="76" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"></rect><text data-claude-text-id="a5-a" x="136" y="608" text-anchor="middle" fill="#1a1a1a">Rerun coupling-gain</text><text data-claude-text-id="a5-b" x="136" y="630" text-anchor="middle" fill="#1a1a1a">sweep, before and after</text></g><g data-claude-anchor="a6"><rect x="24" y="688" width="224" height="76" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"></rect><text data-claude-text-id="a6-a" x="136" y="720" text-anchor="middle" font-weight="600" fill="#1a1a1a">You decide 9.80:</text><text data-claude-text-id="a6-b" x="136" y="742" text-anchor="middle" fill="#1a1a1a">cap the secondary gain?</text></g><g data-claude-anchor="b5"><rect x="268" y="576" width="224" height="76" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"></rect><text data-claude-text-id="b5-a" x="380" y="608" text-anchor="middle" fill="#1a1a1a">1.2: orphenadrine and</text><text data-claude-text-id="b5-b" x="380" y="630" text-anchor="middle" fill="#1a1a1a">item 25&#x27;s partition</text></g><g data-claude-anchor="b6"><rect x="268" y="688" width="224" height="76" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"></rect><text data-claude-text-id="b6-a" x="380" y="720" text-anchor="middle" font-weight="600" fill="#1a1a1a">You: lockbox</text><text data-claude-text-id="b6-b" x="380" y="742" text-anchor="middle" fill="#1a1a1a">go-ahead</text></g><g data-claude-anchor="b7"><rect x="268" y="800" width="224" height="76" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"></rect><text data-claude-text-id="b7-a" x="380" y="832" text-anchor="middle" fill="#1a1a1a">1.1: draw the</text><text data-claude-text-id="b7-b" x="380" y="854" text-anchor="middle" fill="#1a1a1a">held-out set</text></g><g data-claude-anchor="c5"><rect x="512" y="576" width="224" height="76" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"></rect><text data-claude-text-id="c5-a" x="624" y="608" text-anchor="middle" fill="#1a1a1a">R0: rate-invariance</text><text data-claude-text-id="c5-b" x="624" y="630" text-anchor="middle" fill="#1a1a1a">check, minutes on CPU</text></g><g data-claude-anchor="c6"><rect x="512" y="688" width="224" height="76" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"></rect><text data-claude-text-id="c6-a" x="624" y="720" text-anchor="middle" fill="#1a1a1a">R1 gain ratios,</text><text data-claude-text-id="c6-b" x="624" y="742" text-anchor="middle" fill="#1a1a1a">R5 elasticities</text></g><g data-claude-anchor="c7"><rect x="512" y="800" width="224" height="76" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"></rect><text data-claude-text-id="c7-a" x="624" y="832" text-anchor="middle" fill="#1a1a1a">Score against the</text><text data-claude-text-id="c7-b" x="624" y="854" text-anchor="middle" fill="#1a1a1a">1,067 HPO pairs</text></g></svg>